[package]
name = "okkhor-gui"
version = "0.1.0-beta.1"
edition = "2024"
description = "Background Bangla phonetic input for Windows, powered by the okkhor crate"
license = "MIT"

# Binary output name.
[[bin]]
name = "okkhor"
path = "src/main.rs"

[dependencies]
okkhor = { version = "0.10", features = ["editor"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
]

[profile.release]
opt-level = 2
strip = true
